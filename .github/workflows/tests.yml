# Runs the offline test suite on every push to main and every pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests must never need real credentials or the network; keep these empty here.
      X_BEARER_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact dependencies
        run: python -m pip install -r requirements.lock
      - name: Django checks
        working-directory: src
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test suite
        working-directory: src
        run: python manage.py test desk -v 1
