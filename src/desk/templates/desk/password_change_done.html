{% load static desk_tags %}<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Changed · Social Listening Desk</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Archivo+Narrow:wght@700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'desk/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'desk/desk.css' %}">
</head>
<body>
<main class="login">
  <div class="login__card" style="max-width: 440px;">
    <div class="brand-wrap"><span class="brand">{% include "desk/partials/_brand_mark.html" %}<span><span class="brand__name">Listening Desk</span><br><span class="brand__sub">NPP Ghana · security settings</span></span></span></div>
    <div class="login__body stack">
      <div class="banner banner--success" role="status">
        {% icon "check-circle" 18 %}
        <div class="banner__text">
          <div class="banner__title">Password updated successfully</div>
          <div class="banner__body">Your account password has been changed.</div>
        </div>
      </div>
      <div>
        <a class="btn btn--primary" href="{% url 'desk:overview' %}">Back to Desk overview</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
