# ==============================================================================
# NPP Ghana Social Listening Desk · PostgreSQL 16 & Redis Services
# Start local/production backend services with:
#   docker compose -f deploy/docker-compose.yml up -d
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: npp_desk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-npp_desk}
      POSTGRES_USER: ${POSTGRES_USER:-npp_user}
      # Required: set POSTGRES_PASSWORD in the environment or .env. There is deliberately no default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (a long random value) before starting}
    ports:
      # Loopback only: Docker port mappings bypass host firewalls, so never publish the database publicly.
      - "127.0.0.1:5432:5432"
    volumes:
      - npp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-npp_user} -d ${POSTGRES_DB:-npp_desk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: npp_desk_redis
    restart: unless-stopped
    # Redis has no password here, so it must only ever listen on loopback.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - npp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  npp_pgdata:
  npp_redisdata:

