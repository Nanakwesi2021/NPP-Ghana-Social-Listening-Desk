# ==============================================================================
# Nginx Configuration for NPP Ghana Social Listening Desk
# Place in /etc/nginx/sites-available/npp-desk and symlink to sites-enabled
# ==============================================================================

upstream npp_desk_app {
    server unix:/run/npp-desk/gunicorn.sock fail_timeout=0;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name desk.npp.org.gh;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name desk.npp.org.gh;

    # SSL certificates (e.g. Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/desk.npp.org.gh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.npp.org.gh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload size
    client_max_body_size 10M;

    # Static assets served directly by Nginx with cache headers
    location /static/ {
        alias /opt/npp-listening-desk/src/desk/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Application reverse proxy
    location / {
        proxy_pass http://npp_desk_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Keep alive settings
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}

